name: Publish

# Pushing a version tag (e.g. v0.3.0) tests and builds the package,
# publishes it to PyPI via Trusted Publishing (no API token), then
# creates the GitHub release with that version's CHANGELOG section as
# its notes and the built files attached.
#
# Before tagging: set __version__ in podcast_generator/__init__.py to match
# the tag, and turn CHANGELOG.md's "## [Unreleased]" heading into
# "## [X.Y.Z] - YYYY-MM-DD". The build job fails if either is missing.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('podcast_generator/__init__.py').read())[1])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package version $VERSION"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract release notes from CHANGELOG.md
        run: |
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 { found = 1; next }
            found && (/^## / || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section"
            exit 1
          fi

      # Base voxport only (no torch download); see ci.yml.
      - run: python -m pip install voxport numpy soundfile python-dotenv platformdirs pytest build twine
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -rs
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/
            release-notes.md

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Must match the environment name in PyPI's Trusted Publisher settings.
    environment:
      name: pypi
      url: https://pypi.org/project/podcast-generator/
    permissions:
      id-token: write  # for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "podcast-generator ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
