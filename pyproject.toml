[build-system]
# 77+ for the PEP 639 `license = "MIT"` expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-generator"
dynamic = ["version"]
description = "Turn markdown podcast scripts into spoken-word audio locally with Kokoro text-to-speech."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brien Alkire" }]
requires-python = ">=3.10"
keywords = [
    "podcast",
    "tts",
    "text-to-speech",
    "kokoro",
    "markdown",
    "audio",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "voxport[kokoro]>=0.5.0",
    "numpy>=2.0",
    "soundfile>=0.13.1",
    "python-dotenv>=1.0.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
# podcast-generator-mcp: use it from Claude Desktop or another MCP client.
mcp = ["mcp>=2.3,<3"]

[project.scripts]
podcast-generator = "podcast_generator.generator:cli"
podcast-generator-mcp = "podcast_generator.mcp_server:main"
podcast-watch = "podcast_generator.watch:cli"

[project.urls]
Homepage = "https://github.com/brienalkire/podcast_generator"
Repository = "https://github.com/brienalkire/podcast_generator"
Documentation = "https://github.com/brienalkire/podcast_generator/blob/main/MANUAL.md"
Changelog = "https://github.com/brienalkire/podcast_generator/blob/main/CHANGELOG.md"
Issues = "https://github.com/brienalkire/podcast_generator/issues"

[tool.setuptools]
packages = ["podcast_generator"]

[tool.setuptools.package-data]
podcast_generator = ["podcast-watch.ps1"]

[tool.setuptools.dynamic]
version = { attr = "podcast_generator.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
